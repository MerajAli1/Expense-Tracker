spring.application.name=backend

# Server Configuration:
# Port 8081 is chosen because port 8080 is in use by system httpd/Apache.
# You can override with PORT environment variable if needed.
server.port=${PORT:8081}

# MongoDB Configuration:
# Defaults to local MongoDB (already running on 127.0.0.1:27017),
# or overrides via MONGODB_URI environment variable if MongoDB Atlas is preferred.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/BusinessTrackerDB}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/BusinessTrackerDB}
spring.mongodb.database=BusinessTrackerDB
spring.data.mongodb.database=BusinessTrackerDB

# Logging
logging.level.com.businesstracker.backend=INFO
